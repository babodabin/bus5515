:root{
  --bg:#2F3230; --face:#FFFFFF; --rim:#3A3D3B; --num:#3A3D3B; --hand:#3A3D3B; --faint:#B5B8B3;
  --a:#4A9A52; --b:#E39A2D; --sec:#D64545; --warn:#E0493A; --warn-text:#C23A2C;
  --line:#E1E2DC; --text:#F1F2EF; --sub:#B9BDB7; --btext:#A8680F; --link:#9ED3A4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:28px 22px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 34px}
.route{display:flex;align-items:baseline;gap:14px}
.plate{font-family:Jost,sans-serif;font-weight:300;font-size:44px;letter-spacing:.04em;line-height:1}
.route p{margin:0;color:var(--sub);font-size:15px}
.gear{border:1.5px solid #5A5E5B;background:none;color:var(--text);border-radius:12px;min-height:44px;
  padding:0 14px;font:inherit;font-size:15px;cursor:pointer}
.pick{display:grid;gap:14px}
.stop{display:block;width:100%;text-align:left;border:1.5px solid;border-radius:22px;padding:24px 22px;font:inherit;cursor:pointer}
.stop strong{display:block;font-size:32px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
.stop span{display:block;margin-top:6px;font-size:14px}
.stop[data-stop="home"]{background:#E3EFE0;border-color:#9CC3A0;color:#213326}
.stop[data-stop="home"] span{color:#4C6650}
.stop[data-stop="snu"]{background:#E1E9F7;border-color:#9DB2DE;color:#1E2A45}
.stop[data-stop="snu"] span{color:#4E5C7C}
.stop[data-stop="gosi"]{background:#ECE3F7;border-color:#BBA3E0;color:#2A1E45}
.stop[data-stop="gosi"] span{color:#5E5078}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .stop[data-stop="home"]{background:#1B2A1E;border-color:#3F6A48;color:#E4EFE6}
  :root:not([data-theme="light"]) .stop[data-stop="home"] span{color:#9DB3A1}
  :root:not([data-theme="light"]) .stop[data-stop="snu"]{background:#1A2238;border-color:#3E5591;color:#E3E9F7}
  :root:not([data-theme="light"]) .stop[data-stop="snu"] span{color:#9DA9C6}
  :root:not([data-theme="light"]) .stop[data-stop="gosi"]{background:#241B33;border-color:#5B4589;color:#EDE7F8}
  :root:not([data-theme="light"]) .stop[data-stop="gosi"] span{color:#AA9FC4}
}
.stop:focus-visible,.back:focus-visible,.gear:focus-visible{outline:3px solid #9ED3A4;outline-offset:3px}
.back{border:none;background:none;color:var(--link);font:inherit;font-size:16px;font-weight:600;
  padding:10px 0;min-height:44px;cursor:pointer}
.where{font-size:28px;font-weight:500;margin:6px 0 0}
.daytype{display:inline-block;margin:10px 0 0;font-size:13px;color:var(--link);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.where-sub{color:var(--sub);font-size:15px;margin:4px 0 0}
.clock{display:flex;justify-content:center;margin:26px 0 22px}
.clock svg{width:min(310px,82vw);height:auto}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:12px 0;border-top:1px solid var(--line)}
.dot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.t{font-family:Jost,sans-serif;font-size:26px;font-variant-numeric:tabular-nums}
.bb{font-size:14px;font-weight:600;color:var(--btext)}
.chk{font-size:12px;color:var(--a);margin-left:6px;font-family:Jost,sans-serif}
.left{font-size:16px;color:var(--sub)}
.left.warn{color:var(--warn-text);font-weight:600}
.empty{padding:16px 0;border-top:1px solid var(--line);color:var(--sub);font-size:17px;line-height:1.5}
.note{color:var(--sub);font-size:13px;margin-top:16px;line-height:1.5}
.fixbar{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--rim);background:var(--face);color:var(--num);
  font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--rim);color:var(--face)}
.btn:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ask{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--face)}
.ask p{margin:0 0 10px;font-size:15px;color:var(--num)}
.toast{margin-top:10px;font-size:14px;color:var(--link);min-height:20px}
.sh{font-size:26px;font-weight:500;margin:6px 0 4px}
.ssub{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.5}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.logrow .lt{font-size:16px}
.logrow .ld{font-size:13px;color:var(--sub);margin-top:2px}
.logrow button{border:1px solid #6E4540;background:none;color:#F0A69C;font:inherit;font-size:14px;border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer}
.tag{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="home">
    <div class="top">
      <div class="route"><div class="plate">5515</div><p>어디서 타요?</p></div>
      <button class="gear" id="openSettings">설정</button>
    </div>
    <div class="pick">
      <button class="stop" data-stop="home"><strong>집</strong><span>집 앞 정류장 · 서울대입구 방향</span></button>
      <button class="stop" data-stop="snu"><strong>서울대입구</strong><span>봉천사거리 · 관악구청 방향</span></button>
      <button class="stop" data-stop="gosi"><strong>고시촌입구</strong><span>집으로 가는 방향</span></button>
    </div>
  </section>

  <section id="settings" hidden>
    <button class="back" id="closeSettings">‹ 처음으로</button>
    <h1 class="sh">시간표 반영</h1>
    <p class="ssub" id="ttStatus"></p>
    <div class="fixbar" style="margin-top:0;margin-bottom:26px">
      <button class="btn primary" id="recalc">기록 반영하기</button>
      <button class="btn" id="resetTT">처음 시간표로</button>
    </div>
    <h1 class="sh">고친 기록</h1>
    <p class="ssub">"지금 버스 왔어요"로 남긴 기록이에요. 잘못 누른 건 지우면 시간표가 원래대로 돌아가요.</p>
    <div id="log"></div>
  </section>

  <section id="detail" hidden>
    <button class="back" id="back">‹ 처음으로</button>
    <h1 class="where" id="where"></h1>
    <p class="where-sub" id="whereSub"></p>
    <p class="daytype" id="dayType"></p>
    <div class="clock">
      <svg viewBox="-6 -6 212 212" role="img" aria-label="현재 시각과 다음 버스">
        <circle cx="100" cy="100" r="101" fill="var(--face)" stroke="var(--rim)" stroke-width="3.5"/>
        <g id="nums"></g>
        <path id="wait" fill="none" stroke="var(--a)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
        <path id="soon" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"/>
        <text id="digital" x="100" y="136" text-anchor="middle" font-size="13" fill="var(--faint)" font-family="Jost, sans-serif" letter-spacing="0.5"></text>
        <line id="hh" x1="100" y1="100" x2="100" y2="56" stroke="var(--hand)" stroke-width="5" stroke-linecap="round"/>
        <line id="mh" x1="100" y1="100" x2="100" y2="34" stroke="var(--hand)" stroke-width="4" stroke-linecap="round"/>
        <g id="sh"><line x1="100" y1="116" x2="100" y2="22" stroke="var(--sec)" stroke-width="1.4" stroke-linecap="round"/><circle cx="100" cy="100" r="3.5" fill="var(--sec)"/></g>
        <circle cx="100" cy="100" r="2.5" fill="var(--hand)"/>
        <g id="marks"></g>
      </svg>
    </div>
    <div id="list"></div>
    <div class="fixbar"><button class="btn primary" id="came">지금 버스 왔어요</button></div>
    <div class="ask" id="ask" hidden>
      <p>방금 온 버스가 어떤 거예요?</p>
      <div class="fixbar" style="margin-top:0">
        <button class="btn" id="fixA">기본(A)</button>
        <button class="btn" id="fixB">B</button>
        <button class="btn" id="fixCancel">취소</button>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <p class="note" id="note"></p>
  </section>
</main>

function basePairs(type){
  const L={}; STOPS.forEach(k=>L[k]=BASE[type][k].trim().split(/\s+/));
  const P=L.home.map((x,i)=>{
    const p={b:/b$/.test(x), ok:false};
    STOPS.forEach(k=>{ let m=toM(L[k][i]); if(i>0 && m<240) m+=1440; p[k]=m; });
    return p;
  });
  // 자정 넘긴 시각 보정 (앞 버스보다 작으면 다음날)
  STOPS.forEach(k=>{ for(let i=1;i<P.length;i++){ if(P[i][k]<P[i-1][k]-600) P[i][k]+=1440; } });
  return P;
}
const OFF={home:0, snu:35, gosi:48};
let FIXES=[], DATA={}, TT=null;
const fixType=f=>f.day||"wk";
function matchFix(P,f,onlyFree){
  const X=f.stop; let best=-1, cost=1e9;
  P.forEach((p,i)=>{
    if(onlyFree && p.ok) return;
    const d=Math.abs(p[X]-f.m); if(d>8) return;
    const c=d+(p.b!==f.b?2:0)+(p.ok?50:0); if(c<cost){cost=c;best=i;}
  });
  return best;
}
function placeFix(P,f){
  const X=f.stop; if(!STOPS.includes(X)) return;
  const i=matchFix(P,f,true);
  if(i>=0){ const p=P[i], d=f.m-p[X]; STOPS.forEach(k=>p[k]+=d); p.b=f.b; p.ok=true; p.anchor=true; }
  else { const n={b:f.b, ok:true, anchor:true}; STOPS.forEach(k=>n[k]=f.m-OFF[X]+OFF[k]); P.push(n); }
}
function recalc(){
  const out={};
  TYPES.forEach(t=>{
    const P=basePairs(t);
    FIXES.filter(f=>fixType(f)===t).sort((a,b)=>a.at<b.at?-1:1).forEach(f=>placeFix(P,f));
    P.sort((a,b)=>a.home-b.home);
    out[t]=P.map(p=>[p.home,p.snu,p.gosi,p.b?1:0,p.ok?1:0]);
  });
  return {ver:BASE_VER, at:new Date().toISOString(), n:FIXES.length, pairs:out};
}
function applyFixes(){
  DATA={};
  TYPES.forEach(t=>{
    let P;
    if(TT&&TT.pairs&&TT.pairs[t]) P=TT.pairs[t].map(a=>({home:a[0],snu:a[1],gosi:a[2],b:!!a[3],ok:!!a[4]}));
    else P=basePairs(t);
    FIXES.filter(f=>fixType(f)===t && (!TT||f.at>TT.at)).sort((a,b)=>a.at<b.at?-1:1).forEach(f=>placeFix(P,f));
    P.sort((a,b)=>a.home-b.home);
    DATA[t]={};
    STOPS.forEach(k=>{ DATA[t][k]={buses:P.map(p=>({m:p[k], hhmm:fmt(p[k]), b:p.b, ok:p.ok})).sort((a,b)=>a.m-b.m)}; });
  });
}

}

function nowMin(d){ let m=d.getHours()*60+d.getMinutes(); if(m<240) m+=1440; return m; }

  const now=new Date();
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds(), ms=now.getMilliseconds();
  setHand("hh",((h%12)+m/60+s/3600)*30,44);

function render(now){
  const type=dayType(now); const d=DATA[type][current];

  $("ask").hidden=true;
  $("toast").textContent=fmt(f.m)+(b?" B":"")+" 버스로 고쳤어요. 다른 정류장 시간도 같이 맞췄어요.";
  if(dbRef){ try{ await dbRef.collection("fixes").doc(f.id).set(f); }catch(e){} }
}
async function removeFix(id){
  const f0=FIXES.find(f=>f.id===id);
  FIXES=FIXES.filter(f=>f.id!==id); saveLocal();
  if(TT && f0 && f0.at<=TT.at){ TT=recalc(); saveTT(); }
  refresh();
  if(dbRef){ try{ await dbRef.collection("fixes").doc(id).delete(); }catch(e){} }
}
$("came").addEventListener("click",()=>{
  $("ask").hidden=false; $("toast").textContent="";
});
$("fixA").addEventListener("click",()=>addFix(false));
$("fixB").addEventListener("click",()=>addFix(true));
$("fixCancel").addEventListener("click",()=>{ $("ask").hidden=true; });
FIXES=loadLocal(); refresh();
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use("db"); if(!db) return;
    dbRef=db;
    db.doc("state/timetable").onSnapshot(d=>{
      if(d.exists){ const v=d.data(); if(v.ver===BASE_VER && (!TT||v.at>TT.at)){ TT=v; try{localStorage.setItem("tt5515",JSON.stringify(TT));}catch(e){} refresh(); } }
    },()=>{});
    db.collection("fixes").onSnapshot(snap=>{
      const remote=snap.docs.map(d=>d.data()).filter(Boolean);
      const ids=new Set(remote.map(f=>f.id));
      const localOnly=FIXES.filter(f=>!ids.has(f.id));
      localOnly.forEach(f=>{ db.collection("fixes").doc(f.id).set(f).catch(()=>{}); });
      FIXES=remote.concat(localOnly); saveLocal(); refresh();
    },()=>{});
  }catch(e){}
})();
</script>
